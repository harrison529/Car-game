<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11131b"><title>Turbo Toy Racing</title><style>:root{font-family:Inter,Arial,sans-serif;color:#f6f3ed;background:#101219;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:4px}button{color:inherit;border:0}button:disabled{opacity:.45;cursor:default}.shell{max-width:1500px;margin:auto;padding:0 44px}header{height:100px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff13}.logo{font:900 italic 30px 'Arial Narrow',Impact,sans-serif;letter-spacing:-1px}.logo span{color:#ff6439}.logo small{display:block;font:9px Inter;letter-spacing:4px;margin-top:3px;color:#94949f}.profile{display:flex;align-items:center;gap:20px;font-size:12px}.coins{color:#f9cf69;background:#242329;padding:11px 17px;border:1px solid #51452e;border-radius:6px}.avatar{background:#f0643f;padding:12px;border-radius:50%;font-weight:800}nav{display:flex;gap:32px;margin:27px 0 35px}nav button{background:none;color:#92939f;padding:10px 0;font-size:12px;font-weight:700}nav button.active{color:white;border-bottom:2px solid #ff6439}.eyebrow{font-size:10px;letter-spacing:2.5px;font-weight:700;color:#ff875f}.heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}h1,h2,h3,p{margin-top:0}h1{font:800 48px 'Arial Narrow',Impact,sans-serif;margin-bottom:6px;letter-spacing:.3px}p{color:#999ba7;font-size:12px;line-height:1.7}.pill{border:1px solid #333640;padding:8px 12px;border-radius:20px;color:#b9bbc4;font-size:10px}.dashboard{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(270px,1fr);gap:24px}.hero{position:relative;overflow:hidden;min-height:365px;border-radius:12px;background:radial-gradient(ellipse at 60% 20%,#53585d,#282e35 45%,#1c2029 80%);border:1px solid #ffffff12;padding:28px}.hero:before{content:'01';position:absolute;right:20px;top:-45px;font:900 290px 'Arial Narrow',Impact,sans-serif;color:#ffffff04}.hero .car-art{width:85%;height:215px;margin:0 auto;display:block;filter:drop-shadow(0 22px 15px #0008)}.hero-top{display:flex;justify-content:space-between}.hero-bottom{display:flex;justify-content:space-between;align-items:end}.hero h2{font:800 32px 'Arial Narrow',Impact,sans-serif;margin:8px 0 0}.primary{background:#ff6339;color:#fff;border-radius:6px;padding:14px 22px;font-size:11px;font-weight:800}.secondary{background:#282c37;border:1px solid #414550;border-radius:6px;padding:12px 18px;font-size:11px;font-weight:700}.specs{display:grid;grid-template-columns:1fr 1fr;gap:30px;background:#1b1e27;border:1px solid #ffffff0a;border-radius:9px;padding:20px;margin-top:14px}.specs label{font-size:9px;color:#9a9daa;letter-spacing:1.5px}.specs b{float:right;color:white}progress{width:100%;height:4px;accent-color:#ff693f;margin-top:10px}.track-card{height:100%;background:#1c2028;border-radius:12px;overflow:hidden;border:1px solid #ffffff10}.track-picture{height:200px;background:linear-gradient(#d8ad86,#eed0a0);position:relative;overflow:hidden}.track-picture svg{width:100%;height:100%}.track-content{padding:24px}.track-content h2{font:700 28px 'Arial Narrow',Impact,sans-serif;margin:8px 0}.track-controls{display:flex;gap:8px;margin-top:20px}.track-controls button{background:#2c303b;border-radius:4px;padding:8px 13px}.track-controls .selected{background:#ff6339}.section-title{display:flex;justify-content:space-between;align-items:center;margin:35px 0 17px}.section-title h2{font:700 23px 'Arial Narrow',Impact,sans-serif;margin:0}.section-title span{font-size:9px;letter-spacing:2px;color:#848896}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.mode{position:relative;text-align:left;padding:24px;border-radius:9px;min-height:160px;background:#1b1e27;border:1px solid #ffffff10;transition:transform .2s,border-color .2s}.mode:hover{transform:translateY(-3px);border-color:#ff6339}.mode.featured{background:linear-gradient(120deg,#a84329,#d75a30);border-color:#ed7743}.mode .icon{font-size:25px;display:block;margin-bottom:18px}.mode h3{font:700 25px 'Arial Narrow',Impact,sans-serif;margin:0 0 5px}.mode p{margin:0;font-size:10px}.mode.featured p{color:#ffd6c5}.arrow{position:absolute;right:23px;bottom:27px;font-size:24px}.bottom-bar{display:flex;justify-content:space-between;gap:20px;margin:25px 0 20px;padding:17px 20px;border:1px solid #ffffff0d;border-radius:6px;font-size:10px;color:#989ba8}.green{color:#79cc99}footer{padding:22px 0;color:#666b79;font-size:9px;display:flex;justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.car-card{padding:20px;border:1px solid #353947;background:#1b1e27;border-radius:10px}.car-card svg{width:100%;height:120px}.car-card h3{font:700 24px 'Arial Narrow',Impact,sans-serif;margin:10px 0}.car-card p{font-size:10px}.car-card button{width:100%}.login,.loading{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at 50% 45%,#39322c,#101219 65%);padding:30px}.login form{width:min(400px,100%);padding:30px;background:#1c202a;border:1px solid #45404a;border-radius:15px}.login input,.friend-input{width:100%;background:#11151d;border:1px solid #444856;border-radius:6px;color:white;padding:14px;margin:12px 0 20px}.login button{width:100%}.login .car-art{width:320px;height:150px}.loading h1{font-size:64px}.loading progress{width:280px;height:6px}.count{font:800 70px 'Arial Narrow',Impact,sans-serif;color:#ff7047}.overlay{position:fixed;inset:0;background:#080b13dd;display:grid;place-items:center;z-index:5;padding:20px}.modal{background:#20242e;border:1px solid #414552;padding:32px;border-radius:12px;width:min(480px,100%);text-align:center}.modal h2{font:800 36px 'Barlow Condensed',Impact}.modal .buttons{display:flex;justify-content:center;gap:12px;margin-top:20px}.race-wrap{max-width:1300px;margin:25px auto;padding:0 20px}.race-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.race-top h2{font:700 28px 'Arial Narrow',Impact,sans-serif;margin:0}.race-stage{position:relative;border-radius:12px;overflow:hidden;border:1px solid #4a4c56;background:#a5bdcc}canvas{display:block;width:100%;aspect-ratio:1100/500}.race-hud{display:flex;gap:22px;background:#20242d;padding:18px;justify-content:space-between;font-size:12px}.touch{display:flex;gap:10px;justify-content:center;margin:18px}.touch button{padding:18px 28px;touch-action:none;user-select:none}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#f16840;padding:14px 25px;border-radius:8px;font-size:12px;z-index:10}.filters{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap}.filters input{background:#20242d;border:1px solid #3e424f;color:white;border-radius:6px;padding:12px;flex:1}.empty{padding:30px;text-align:center}.statline{display:flex;gap:20px;font-size:12px;color:#bcc1cc}.hint{color:#8c919d;font-size:10px;text-align:center} @media(min-width:1600px){.shell{padding:0 65px}}@media(max-width:850px){.shell{padding:0 20px}.dashboard{grid-template-columns:1fr}.track-card{display:grid;grid-template-columns:1fr 1fr}.track-picture{height:100%}.grid{grid-template-columns:repeat(2,1fr)}.hero{min-height:320px}.modes{gap:10px}.mode{padding:18px}.profile{gap:10px}.bottom-bar{flex-wrap:wrap}}@media(max-width:520px){header{height:80px}.logo{font-size:24px}.profile .driver{display:none}nav{gap:24px;margin-bottom:20px}h1{font-size:36px}.heading .pill{display:none}.hero{padding:18px}.hero .car-art{height:170px;width:100%}.hero h2{font-size:25px}.modes{grid-template-columns:1fr}.mode{min-height:110px}.mode .icon{float:left;margin:10px 20px 25px 0}.track-card{display:block}.track-picture{height:150px}.grid{gap:10px}.car-card{padding:12px}.car-card h3{font-size:21px}.race-hud{gap:10px;font-size:10px;padding:12px}.race-top h2{font-size:20px}footer{gap:20px}.statline{font-size:10px}}
</style></head><body><div id="app"></div><script>const tracks = [
 {name:'Sunset Speedway',tag:'THE ORIGINAL ORANGE',sky:'#eab880',ground:'#936247',difficulty:'Easy',length:6000},
 {name:'Neon Nightfall',tag:'AFTER HOURS',sky:'#282449',ground:'#383148',difficulty:'Medium',length:6800},
 {name:'Canyon Run',tag:'DUST & THUNDER',sky:'#d88858',ground:'#994b38',difficulty:'Medium',length:7200},
 {name:'Glacier Rush',tag:'BREAK THE ICE',sky:'#abcddc',ground:'#6c99a9',difficulty:'Hard',length:7600},
 {name:'Volcano Velocity',tag:'FEEL THE HEAT',sky:'#643d43',ground:'#542f32',difficulty:'Extreme',length:8000}
];
const names=['Twin Flame','Bone Rattler','Night Shifter','Shark Attack','Rocket Rider','Street Phantom','Thunder Bolt','Cobra Drift','Desert Demon','Cosmic Coupe','Dragon Wagon','Neon Viper','Track Titan','Speed Specter','Fire Falcon','Chrome Comet','Atomic Arrow','Midnight Muscle','Rally Raptor','Golden Ghost'];
const cars=Array.from({length:60},(_,i)=>({id:i,name:names[i%20]+(i<20?'':i<40?' GT':' X'),color:['#f45731','#38b9db','#e7cf58','#b57ce5','#67bc99','#f188b0'][i%6],speed:70+i%7*4,handling:70+(i*3)%27,price:400+i*75,rarity:i%5===0?'LEGENDARY':i%3===0?'RARE':'STREET'}));
function dailyShop(date=new Date()){const day=Math.floor(date.getTime()/86400000);return Array.from({length:6},(_,i)=>cars[(day*7+i*9)%60]);}
function loadProfile(storage){try{const p=JSON.parse(storage.getItem('turbo-profile'));if(!p||typeof p.name!=='string')return null;return {...p,coins:Math.max(0,Number(p.coins)||0),owned:[...new Set([0,...(Array.isArray(p.owned)?p.owned.filter(x=>Number.isInteger(x)&&x>=0&&x<60):[])])],selected:Number.isInteger(p.selected)&&p.selected>=0&&p.selected<60&&p.owned?.includes(p.selected)?p.selected:0,races:Number(p.races)||0,wins:Number(p.wins)||0};}catch{return null;}}
function buyCar(profile,id){const car=cars[id];if(!car||profile.owned.includes(id)||profile.coins<car.price)return false;profile.coins-=car.price;profile.owned.push(id);return true;}
function terrain(x){return 375+Math.sin(x/280)*32+Math.sin(x/110)*12;}

const app=document.querySelector('#app');let profile=loadProfile(localStorage),tab='play',track=0,race=null,frame=0,filter='all',query='';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>localStorage.setItem('turbo-profile',JSON.stringify(profile));
function art(car,cls='car-art'){return `<svg class="${cls}" viewBox="0 0 600 240" role="img" aria-label="${esc(car.name)} race car"><defs><linearGradient id="paint${car.id}" x2="0" y2="1"><stop stop-color="${car.color}"/><stop offset=".5" stop-color="${car.color}"/><stop offset="1" stop-color="#54282b"/></linearGradient></defs><ellipse cx="307" cy="201" rx="233" ry="15" fill="#0005"/><path d="M47 142 74 112 193 102 254 52 372 56 429 112 520 123 557 148 548 180 54 180Z" fill="url(#paint${car.id})" stroke="#ffffff25" stroke-width="3"/><path d="m208 101 52-41 53 2-4 44Zm117-38 43 2 41 43-85-3Z" fill="#1b2a34" stroke="#9aabb0" stroke-width="3"/><path d="m87 124 93-6-18 45-88-3Z" fill="#ffffff18"/><path d="m210 113 186 4 27 46-231-4Z" fill="#10151b"/><path d="m250 115 78 2-44 44h-52Z" fill="#fff"/><text x="300" y="153" fill="#fff" font-family="Arial" font-style="italic" font-weight="900" font-size="35">${String(car.id+1).padStart(2,'0')}</text><path d="M46 111h86v12H46Zm436-22h66v12h-66Zm18 9h9v32h-9Z" fill="#141923"/><path d="m516 134 26 7-2 9h-28Z" fill="#fff1b1"/><path d="M63 147h25v10H59Z" fill="#ffdcad"/><path d="M205 175h194" stroke="#f6c56b" stroke-width="5"/>${[153,451].map(x=>`<circle cx="${x}" cy="175" r="43" fill="#11151c" stroke="#2e3036" stroke-width="8"/><circle cx="${x}" cy="175" r="25" fill="#747f8d"/><circle cx="${x}" cy="175" r="18" fill="#232a33"/><path d="M${x-21} 175h42m-21-21v42m-15-36 30 30m-30 0 30-30" stroke="#c8cdd2" stroke-width="4"/><circle cx="${x}" cy="175" r="6" fill="#ff7447"/>`).join('')}</svg>`;}
function logo(){return '<div class="logo">TURBO<span>TOY</span><small>SMALL CARS. BIG LEGENDS.</small></div>';}
function toast(t){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.append(el);setTimeout(()=>el.remove(),3000);}
function login(){app.innerHTML=`<div class="login">${logo()}${art(cars[0])}<h1>YOUR LEGEND STARTS HERE.</h1><p>Orange tracks. Wild rides. Full throttle.</p><form><label for="name">CREATE YOUR DRIVER PROFILE</label><input id="name" name="name" placeholder="Enter your driver name" maxlength="20" required autocomplete="nickname"><button class="primary">LET’S RACE →</button><p style="margin:18px 0 0">Local profile · saved on this device<br>No password or email required.</p></form><p style="margin-top:25px">An independent toy-car racer inspired by Hot Wheels.<br>Not affiliated with or endorsed by Mattel.</p></div>`;app.querySelector('form').onsubmit=e=>{e.preventDefault();const name=app.querySelector('input').value.trim();if(!name)return;profile={name,coins:2000,owned:[0],selected:0,races:0,wins:0};save();loading(3,'START YOUR ENGINES','Getting your garage ready',home);};}
function loading(seconds,title,detail,next){cancelAnimationFrame(frame);let left=seconds;app.innerHTML=`<div class="loading">${logo()}<div style="margin-top:65px" class="eyebrow">${esc(detail)}</div><h1>${title}</h1><div class="count">${left}</div><progress max="${seconds}" value="0"></progress><p class="load-detail">${seconds===10?'Local matchmaking · bot opponents fill empty seats':''}</p></div>`;const timer=setInterval(()=>{left--;app.querySelector('.count').textContent=left;app.querySelector('progress').value=seconds-left;if(left<=0){clearInterval(timer);next();}},1000);}
function shell(content){app.innerHTML=`<div class="shell"><header>${logo()}<div class="profile"><span class="coins">◈ ${profile.coins.toLocaleString()} <small>COINS</small></span><span class="driver">${esc(profile.name)}</span><span class="avatar">${esc(profile.name[0].toUpperCase())}</span></div></header><nav>${[['play','RACE HQ'],['garage','MY GARAGE'],['shop','DAILY SHOP']].map(([id,label])=>`<button data-tab="${id}" class="${tab===id?'active':''}">${label}</button>`).join('')}</nav>${content}<footer><span>TURBO TOY RACING © 2026 · INDEPENDENT FAN-INSPIRED GAME</span><span>LOCAL PLAY <span class="green">●</span> &nbsp; ALL SYSTEMS GO</span></footer></div>`;app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;home();});}
function trackPicture(){return `<svg viewBox="0 0 500 240" preserveAspectRatio="xMidYMid slice" aria-label="Orange loop track at sunset" role="img"><circle cx="390" cy="60" r="37" fill="#ffe6b8"/><path d="M0 160 70 100 130 168 210 80 310 180 390 100 500 160V240H0" fill="#b78668"/><path d="M0 190 120 145 200 195 330 140 500 185V240H0" fill="#8d6b58"/><path d="M-30 220 140 210C190 208 215 183 215 137a52 52 0 1 1 54 52L500 177" fill="none" stroke="#75422b" stroke-width="20"/><path d="M-30 212 140 202C190 200 215 175 215 129a52 52 0 1 1 54 52L500 169" fill="none" stroke="#ff752e" stroke-width="13"/><path d="M-30 207 140 197C190 195 215 170 215 124a52 52 0 1 1 54 52L500 164" fill="none" stroke="#ffb25c" stroke-width="3"/></svg>`;}
function home(){race=null;if(tab!=='play'){collection();return;}const car=cars[profile.selected];shell(`<div class="heading"><div><div class="eyebrow">WELCOME BACK, ${esc(profile.name.toUpperCase())}</div><h1>READY. SET. UNLEASH.</h1><p>Your next great race is just one launch away.</p></div><span class="pill">◷ SEASON 01 · THE ORANGE ERA</span></div><div class="dashboard"><div><div class="hero"><div class="hero-top"><span class="eyebrow">YOUR CURRENT RIDE</span><span class="pill">${car.rarity} SERIES</span></div>${art(car)}<div class="hero-bottom"><div><span class="eyebrow">#${String(car.id+1).padStart(2,'0')} / 60</span><h2>${car.name.toUpperCase()}</h2></div><button class="secondary" id="garage">CHANGE CAR ↗</button></div></div><div class="specs"><div><label>TOP SPEED <b>${car.speed}</b></label><progress max="100" value="${car.speed}"></progress></div><div><label>HANDLING <b>${car.handling}</b></label><progress max="100" value="${car.handling}"></progress></div></div></div><div class="track-card"><div class="track-picture">${trackPicture()}</div><div class="track-content"><span class="eyebrow">NEXT DESTINATION / 0${track+1}</span><h2>${tracks[track].name.toUpperCase()}</h2><p>Big loops. Bigger air. Own every inch of the orange track.</p><span class="pill">${tracks[track].difficulty} &nbsp; · &nbsp; ${(tracks[track].length/1000).toFixed(1)} KM</span><div class="track-controls" aria-label="Choose a track">${tracks.map((t,i)=>`<button aria-label="${t.name}" data-track="${i}" class="${track===i?'selected':''}">0${i+1}</button>`).join('')}</div></div></div></div><div class="section-title"><h2>PICK YOUR PLAYGROUND</h2><span>BUILT FOR A LITTLE COMPETITION</span></div><div class="modes"><button class="mode featured" data-mode="quick"><span class="icon">⚡</span><h3>QUICK PLAY</h3><p>One track. Four cars. All-out racing.</p><span class="arrow">↗</span></button><button class="mode" data-mode="friend"><span class="icon">⚑</span><h3>FRIEND RACING</h3><p>Two drivers. One keyboard. Bragging rights.</p><span class="arrow">↗</span></button><button class="mode" data-mode="tournament"><span class="icon">♜</span><h3>TOURNAMENT</h3><p>Three rounds. Four racers. One champion.</p><span class="arrow">↗</span></button></div><div class="bottom-bar"><span><span class="green">●</span> LOCAL MODE · Bots ready to race</span><span>${profile.races} RACES &nbsp; / &nbsp; ${profile.wins} WINS &nbsp; / &nbsp; ${profile.owned.length} CARS COLLECTED</span><span>DAILY SHOP &nbsp; NEW RIDES EVERY DAY ↗</span></div>`);app.querySelector('#garage').onclick=()=>{tab='garage';home();};app.querySelectorAll('[data-track]').forEach(b=>b.onclick=()=>{track=+b.dataset.track;home();});app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>b.dataset.mode==='friend'?friendDialog():match(b.dataset.mode));}
function collection(){const shop=tab==='shop',list=shop?dailyShop():cars;const midnight=new Date();midnight.setUTCHours(24,0,0,0);const hours=Math.ceil((midnight-Date.now())/3600000);shell(`<div class="heading"><div><div class="eyebrow">${shop?'FRESH FINDS. EVERY DAY.':'SMALL CARS. BIG PERSONALITY.'}</div><h1>${shop?'THE DAILY DROP.':'YOUR DREAM GARAGE.'}</h1><p>${shop?`Six rotating cars · refreshes in ${hours} hours (00:00 UTC). Earn coins by finishing races.`:`${profile.owned.length} / 60 cars collected. Pick your next legend.`}</p></div><span class="pill">${shop?'◈ STARTER BONUS: 2,000 COINS':'60 UNIQUE RIDES'}</span></div>${!shop?`<div class="filters"><input id="search" aria-label="Search cars" placeholder="Search your next ride…" value="${esc(query)}"><button class="secondary" id="filter">${filter==='all'?'SHOW OWNED':'SHOW ALL 60'}</button></div>`:''}<div class="grid">${list.filter(c=>(filter==='all'||shop||profile.owned.includes(c.id))&&(!query||shop||c.name.toLowerCase().includes(query.toLowerCase()))).map(c=>`<div class="car-card"><span class="eyebrow">#${String(c.id+1).padStart(2,'0')} · ${c.rarity}</span>${art(c)}<h3>${c.name.toUpperCase()}</h3><p>SPEED ${c.speed} &nbsp; HANDLING ${c.handling}</p><button data-car="${c.id}" class="${profile.selected===c.id?'secondary':'primary'}" ${profile.selected===c.id||(!shop&&!profile.owned.includes(c.id))?'disabled':''}>${profile.selected===c.id?'SELECTED ✓':profile.owned.includes(c.id)?'SELECT CAR':shop?`◈ ${c.price.toLocaleString()} · BUY`:'IN DAILY SHOP'}</button></div>`).join('')}</div>`);app.querySelectorAll('[data-car]').forEach(b=>b.onclick=()=>{const id=+b.dataset.car;if(profile.owned.includes(id)){profile.selected=id;save();collection();}else if(buyCar(profile,id)){save();collection();toast('New ride added to your garage!');}else toast('Not enough coins. Finish races to earn more.');});if(!shop){app.querySelector('#filter').onclick=()=>{filter=filter==='all'?'owned':'all';collection();};app.querySelector('#search').oninput=e=>{query=e.target.value;const pos=e.target.selectionStart;collection();const input=app.querySelector('#search');input.focus();input.setSelectionRange(pos,pos);};}}
function friendDialog(){const overlay=document.createElement('div');overlay.className='overlay';overlay.innerHTML=`<form class="modal"><span class="eyebrow">COUCH COMPETITION</span><h2>BRING YOUR RIVAL.</h2><p>Race a friend on this keyboard, alongside two bots.<br>You: arrows + Space. Friend: A / D + W.<br>Live internet lobbies are not connected.</p><label for="friend">Friend’s driver name</label><input class="friend-input" id="friend" maxlength="20" required placeholder="Player two"><div class="buttons"><button type="button" class="secondary">CANCEL</button><button class="primary">LET’S RACE →</button></div></form>`;app.append(overlay);overlay.querySelector('input').focus();overlay.querySelector('[type="button"]').onclick=()=>overlay.remove();overlay.querySelector('form').onsubmit=e=>{e.preventDefault();const name=overlay.querySelector('input').value.trim();if(name)match('friend',name);};}
let tournament=null;
function match(mode,friend='',round=0){if(mode==='tournament'&&round===0)tournament={scores:[0,0,0,0],startTrack:track};loading(10,mode==='tournament'?`ROUND ${round+1} · FIND YOUR GRID`:'FIND YOUR GRID','MATCHMAKING',()=>startRace(mode,friend,round));}
const keys=new Set();window.addEventListener('keydown',e=>{if(!race)return;if(['ArrowRight','ArrowLeft',' ','ArrowUp','a','d','w','A','D','W','Escape'].includes(e.key)){e.preventDefault();keys.add(e.key.toLowerCase());if(e.key==='Escape')togglePause();}});window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>{keys.clear();if(race&&!race.paused)togglePause();});
function startRace(mode,friend,round){keys.clear();const ti=mode==='tournament'?(tournament.startTrack+round)%5:track,t=tracks[ti];race={mode,friend,round,track:ti,time:0,paused:false,ended:false,countdown:3,players:Array.from({length:4},(_,i)=>({name:i===0?profile.name:i===1&&friend?friend:['','AXEL • BOT','NOVA • BOT','REX • BOT'][i],x:20-i*8,speed:0,y:0,vy:0,boost:100,hits:0,hitAt:-10,finished:0,car:i===0?cars[profile.selected]:cars[(profile.selected+i*11)%60]}))};app.innerHTML=`<div class="race-wrap"><div class="race-top"><div><span class="eyebrow">${mode.toUpperCase()} ${mode==='tournament'?`· ROUND ${round+1}/3`:''}</span><h2>${t.name.toUpperCase()}</h2></div><button class="secondary" id="pause">PAUSE Ⅱ</button></div><div class="race-stage"><canvas width="1100" height="500" aria-label="Side-scrolling race. Hold right to accelerate, Space to jump, up to boost."></canvas><div class="race-hud"><span id="position">POSITION 1 / 4</span><span id="distance">0 M</span><span id="boost">BOOST 100%</span><span id="time">0:00</span></div></div><div class="touch"><button class="secondary" data-key="ArrowLeft">BRAKE</button><button class="primary" data-key="ArrowRight">GAS →</button><button class="secondary" data-key=" ">JUMP ↑</button><button class="secondary" data-key="ArrowUp">BOOST ⚡</button></div><p class="hint">HOLD → TO ACCELERATE · ← BRAKE · SPACE JUMP · ↑ BOOST · ESC PAUSE${friend?' · PLAYER 2: D GAS / A BRAKE / W JUMP':''}</p><p class="hint">Jump over red barriers. Hit ramps for air. Keep your speed through the loops.</p></div>`;app.querySelector('#pause').onclick=togglePause;app.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key.toLowerCase();b.onpointerdown=e=>{e.preventDefault();keys.add(k);b.setPointerCapture(e.pointerId);};b.onpointerup=b.onpointercancel=()=>keys.delete(k);});let last=performance.now();const loop=now=>{if(!race)return;const dt=Math.min((now-last)/1000,.04);last=now;if(!race.paused)update(dt);if(race)draw();frame=requestAnimationFrame(loop);};frame=requestAnimationFrame(loop);}
function togglePause(){if(!race||race.ended)return;race.paused=!race.paused;if(race.paused){const el=document.createElement('div');el.className='overlay';el.id='pause-modal';el.innerHTML='<div class="modal"><h2>PIT STOP.</h2><p>Take a breather. Your race is paused.</p><div class="buttons"><button class="primary" id="resume">RESUME →</button><button class="secondary" id="quit">QUIT TO HQ</button></div></div>';app.append(el);el.querySelector('#resume').onclick=togglePause;el.querySelector('#quit').onclick=()=>{cancelAnimationFrame(frame);race=null;keys.clear();home();};}else app.querySelector('#pause-modal')?.remove();}
function obstacles(t){const len=tracks[t].length;return Array.from({length:Math.floor(len/800)},(_,i)=>({x:700+i*800+(t*53)%160,type:i%3===1?'ramp':'barrier'}));}
function update(dt){const r=race;if(r.ended)return;if(r.countdown>0){r.countdown-=dt;return;}r.time+=dt;const len=tracks[r.track].length;for(let i=0;i<4;i++){const p=r.players[i];if(p.finished)continue;const human=i===0||(i===1&&r.friend);const gas=human?keys.has(i===0?'arrowright':'d'):true,brake=human&&keys.has(i===0?'arrowleft':'a'),jump=human?keys.has(i===0?' ':'w'):obstacles(r.track).some(o=>o.type==='barrier'&&o.x-p.x>0&&o.x-p.x<110);const boost=i===0&&keys.has('arrowup')&&p.boost>0;const top=(i===0?260+p.car.speed:300+i*5);p.speed+=((gas?top*(boost?1.45:1):0)-p.speed)*dt*(brake?5:1.2);if(brake)p.speed*=1-dt*3;if(boost&&gas)p.boost=Math.max(0,p.boost-dt*28);else p.boost=Math.min(100,p.boost+dt*6);if(jump&&p.y===0)p.vy=-380;const old=p.x;p.x+=p.speed*dt;p.vy+=dt*900;p.y+=p.vy*dt;if(p.y>=0){p.y=0;p.vy=0;}for(const o of obstacles(r.track)){if(o.type==='ramp'&&old<o.x&&p.x>=o.x&&p.y===0)p.vy=-470;if(o.type==='barrier'&&Math.abs(p.x-o.x)<28&&p.y>-35&&r.time-p.hitAt>1){p.speed*=.28;p.hitAt=r.time;p.hits++;}}if(p.x>=len){p.x=len;p.finished=r.time;}}
const player=r.players[0],place=r.players.filter(p=>p.x>player.x).length+1;app.querySelector('#position').textContent=`POSITION ${place} / 4`;app.querySelector('#distance').textContent=`${Math.floor(player.x)} / ${len} M`;app.querySelector('#boost').textContent=`BOOST ${Math.floor(player.boost)}%`;app.querySelector('#time').textContent=`${Math.floor(r.time/60)}:${String(Math.floor(r.time%60)).padStart(2,'0')}`;if((player.finished&&(!r.friend||r.players[1].finished))||r.time>150)finishRace();}
function drawCar(ctx,p,x,y,scale=1,angle=0){ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.scale(scale,scale);ctx.fillStyle=p.car.color;ctx.beginPath();ctx.moveTo(-28,-13);ctx.lineTo(-14,-20);ctx.lineTo(-4,-31);ctx.lineTo(16,-31);ctx.lineTo(29,-19);ctx.lineTo(41,-14);ctx.lineTo(42,-4);ctx.lineTo(-29,-4);ctx.closePath();ctx.fill();ctx.fillStyle='#1d2c3a';ctx.fillRect(0,-28,14,10);ctx.fillStyle='#fff';ctx.fillRect(-7,-17,13,11);ctx.fillStyle='#18202a';for(const xx of [-15,28]){ctx.beginPath();ctx.arc(xx,-3,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#abb0b8';ctx.beginPath();ctx.arc(xx,-3,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#18202a';}ctx.restore();}
function draw(){const r=race,ctx=app.querySelector('canvas').getContext('2d'),t=tracks[r.track],camera=Math.max(0,r.players[0].x-260);ctx.fillStyle=t.sky;ctx.fillRect(0,0,1100,500);ctx.fillStyle='#fff4bd';ctx.beginPath();ctx.arc(910-camera*.015,80,40,0,Math.PI*2);ctx.fill();for(let layer=0;layer<2;layer++){ctx.fillStyle=layer?t.ground+'88':t.ground+'44';ctx.beginPath();ctx.moveTo(0,500);for(let x=0;x<=1120;x+=20)ctx.lineTo(x,245+layer*55+Math.sin((x+camera*(.15+layer*.1))/170)*45+Math.cos(x/80)*15);ctx.lineTo(1100,500);ctx.fill();}ctx.fillStyle=t.ground;ctx.beginPath();ctx.moveTo(0,500);for(let x=0;x<=1120;x+=10)ctx.lineTo(x,terrain(x+camera)+15);ctx.lineTo(1100,500);ctx.fill();ctx.lineWidth=16;ctx.strokeStyle='#cc4d19';ctx.beginPath();for(let x=0;x<=1120;x+=5){const y=terrain(x+camera);if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.stroke();ctx.lineWidth=4;ctx.strokeStyle='#ffad54';ctx.stroke();const len=t.length;for(let lx=1500;lx<len-400;lx+=2200){const sx=lx-camera,cy=terrain(lx)-77;ctx.strokeStyle='#c74b1c';ctx.lineWidth=17;ctx.beginPath();ctx.arc(sx,cy,77,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='#ff9e41';ctx.lineWidth=4;ctx.stroke();ctx.strokeStyle='#74514b';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(sx-55,cy+45);ctx.lineTo(sx-80,460);ctx.moveTo(sx+55,cy+45);ctx.lineTo(sx+80,460);ctx.stroke();}
for(const o of obstacles(r.track)){const x=o.x-camera,y=terrain(o.x);if(x<-80||x>1180)continue;if(o.type==='barrier'){ctx.fillStyle='#ec493e';ctx.fillRect(x-12,y-35,24,30);ctx.fillStyle='#fff1c9';ctx.fillRect(x-12,y-27,24,5);}else{ctx.fillStyle='#fa813b';ctx.beginPath();ctx.moveTo(x-55,y);ctx.lineTo(x+10,y-40);ctx.lineTo(x+10,y);ctx.fill();}}
const fx=len-camera;if(fx<1150){ctx.fillStyle='#eee';ctx.fillRect(fx,100,6,300);for(let a=0;a<5;a++)for(let b=0;b<3;b++){ctx.fillStyle=(a+b)%2?'#17212d':'#fff';ctx.fillRect(fx+a*13,100+b*13,13,13);}}
for(let i=3;i>=0;i--){const p=r.players[i],x=p.x-camera;let y=terrain(p.x)+p.y-5-i*5,angle=Math.atan2(terrain(p.x+5)-terrain(p.x-5),10);for(let lx=1500;lx<len-400;lx+=2200){const d=p.x-lx;if(Math.abs(d)<120){const theta=(d+120)/240*Math.PI*2;const radius=77;y=terrain(lx)-77+Math.cos(theta)*radius+p.y-5;const loopX=lx-camera+Math.sin(theta)*radius;drawCar(ctx,p,loopX,y,1,-theta);ctx.fillStyle='#fff';ctx.font='bold 11px Arial';ctx.textAlign='center';ctx.fillText(p.name,loopX,y-50);angle=null;break;}}if(angle!==null){drawCar(ctx,p,x,y,1,angle);ctx.fillStyle=i===0?'#fff':'#252b38';ctx.font='bold 11px Arial';ctx.textAlign='center';ctx.fillText(p.name,x,y-50);}}
ctx.textAlign='left';ctx.fillStyle='#0004';ctx.fillRect(25,20,210,50);ctx.fillStyle='#fff';ctx.font='bold 26px Arial';ctx.fillText(`${Math.floor(r.players[0].speed*.5)} KM/H`,40,54);if(r.countdown>0){ctx.fillStyle='#10121bb0';ctx.fillRect(0,0,1100,500);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='900 100px Arial';ctx.fillText(Math.ceil(r.countdown),550,260);ctx.font='bold 18px Arial';ctx.fillText('HOLD → TO LAUNCH',550,310);} }
function finishRace(){const r=race;r.ended=true;const ranked=[...r.players].sort((a,b)=>(a.finished||Infinity)-(b.finished||Infinity)||b.x-a.x);const place=ranked.indexOf(r.players[0])+1;const reward=[600,400,300,200][place-1];profile.coins+=reward;profile.races++;if(place===1)profile.wins++;save();if(r.mode==='tournament')ranked.forEach((p,i)=>tournament.scores[r.players.indexOf(p)]+=[10,6,4,2][i]);const final=r.mode!=='tournament'||r.round===2;const el=document.createElement('div');el.className='overlay';el.innerHTML=`<div class="modal"><span class="eyebrow">${r.mode==='tournament'&&final?'TOURNAMENT COMPLETE':'FINISH LINE'}</span><h2>${place===1?'VICTORY LAP!':`PLACE #${place} · NICE RUN!`}</h2><p>+${reward} coins added to your garage fund.</p>${ranked.map((p,i)=>`<div class="bottom-bar" style="margin:8px 0"><span>${i+1}. ${esc(p.name)}</span><span>${p.finished?p.finished.toFixed(1)+'s':'Finished behind'}${r.mode==='tournament'?' · '+tournament.scores[r.players.indexOf(p)]+' pts':''}</span></div>`).join('')}${r.mode==='tournament'&&final?`<p style="margin-top:15px">Champion: ${esc(r.players[tournament.scores.indexOf(Math.max(...tournament.scores))].name)}</p>`:''}<div class="buttons"><button class="primary" id="continue">${final?'BACK TO RACE HQ':'NEXT ROUND →'}</button></div></div>`;app.append(el);el.querySelector('#continue').onclick=()=>{cancelAnimationFrame(frame);race=null;if(final)loading(2,'BACK TO THE GARAGE','SAVING YOUR RACE',()=>{tab='play';home();});else match('tournament','',r.round+1);};}
if(profile)home();else login();
</script></body></html>
